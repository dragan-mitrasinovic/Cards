# Weekly dependency update PRs. Cooldowns skip brand-new releases (supply-chain protection);
# security updates ignore the cooldown and arrive right away. Keep the cooldowns >= min-release-age in .npmrc.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Europe/Belgrade
    cooldown:
      default-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # Angular majors go through `ng update` (all packages together, with code migrations).
      - dependency-name: "@angular/*"
        update-types: [version-update:semver-major]
      # Angular pins the TypeScript version it supports, so TypeScript moves with Angular.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Europe/Belgrade
    cooldown:
      default-days: 3
      semver-minor-days: 7
      semver-major-days: 30

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Europe/Belgrade
    cooldown:
      default-days: 7
    ignore:
      # Major Node.js upgrades are done by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: Europe/Belgrade
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
